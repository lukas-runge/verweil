name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test core, build and lint the Android app
        run: ./gradlew :core:jvmTest :androidApp:assembleDebug :androidApp:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: verweil-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
